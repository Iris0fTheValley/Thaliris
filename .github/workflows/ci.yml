name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      adapter_ref:
        description: "Optional branch, tag, or commit for a manual adapter compatibility check. Leave empty to use the reviewed pin."
        required: false
        type: string
        default: ""
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - name: Core authority regression
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_core_authority.py --junitxml=results/core-authority.xml
      - name: Mechanical Core regression
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_mechanical_core.py --junitxml=results/mechanical-core.xml
      - name: Core CLI regression
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_core_cli.py --junitxml=results/core-cli.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: core-test-results-${{ matrix.os }}-python-${{ matrix.python }}
          path: results/*.xml
  benchmark-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Iris0fTheValley/Thaliris-Codex
          path: codex-adapter
          ref: ${{ inputs.adapter_ref || '3d2d3026c9a81790219040f926baa2f975f8bce1' }}
      - name: Selected adapter identity
        run: 'git -C codex-adapter show -s --format="Adapter commit: %H%nSubject: %s" HEAD'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install --no-deps ./codex-adapter
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - name: Benchmark protocol
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_benchmark_protocol.py --junitxml=results/benchmark-protocol.xml
      - name: D11 collector
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_d11_collector.py --junitxml=results/d11-collector.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: core-benchmark-source-results
          path: results/*.xml
