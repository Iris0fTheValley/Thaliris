[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thaliris"
version = "0.2.0"
description = "Thaliris: Git-native context packs for Codex workflows"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Thaliris contributors"}]
keywords = ["codex", "context", "memory", "multi-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/Iris0fTheValley/Thaliris"
Issues = "https://github.com/Iris0fTheValley/Thaliris/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
context = "thaliris.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/thaliris"]

[tool.hatch.build.targets.sdist]
exclude = ["/HANDOFF.md"]
