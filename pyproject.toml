[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thaliris"
version = "0.4.4"
description = "Host-neutral mechanical task ledger, evidence, retrieval, memory and authority"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Thaliris contributors"}]
keywords = ["context", "lifecycle", "memory", "artifacts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/Iris0fTheValley/Thaliris"
Issues = "https://github.com/Iris0fTheValley/Thaliris/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
thaliris-core = "thaliris.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["benchmarks/abcd/historical"]

[tool.hatch.build.targets.wheel]
packages = ["src/thaliris"]

[tool.hatch.build.targets.sdist]
exclude = ["/HANDOFF.md"]
